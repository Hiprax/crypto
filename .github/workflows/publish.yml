name: Publish to npm

on:
  release:
    types: [published]

# Only one publish workflow may run at a time on the same ref so a duplicate
# release event cannot race with itself and double-publish a tag.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      # Required so npm provenance can attest the published package back to
      # this workflow run via the OIDC token.
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to a recent LTS for the publish job — there is no value in
          # matrix-publishing the same artefact from multiple Node versions.
          # Matches the engines.node floor (>=22.0.0); Node 20 EOL'd 2026-04-30.
          node-version: 22
          # The npm registry must be set explicitly here so the publish
          # auth handshake uses NPM_TOKEN against npmjs.com rather than
          # any internal/proxy registry the runner may default to.
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # `--access public` is required for scoped packages (`@hiprax/crypto`)
      # because npm defaults scoped publishes to private. `--provenance` opts
      # the package into npm's package-provenance attestations so consumers
      # can verify the build came from this exact GitHub Actions run.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
