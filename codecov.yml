# Codecov configuration for @hiprax/crypto.
# Reference: https://docs.codecov.com/docs/codecov-yaml
#
# Philosophy: the local Jest threshold in `jest.config.js` is the gate that
# fails CI. It is a one-way ratchet holding the measured `All files` values
# floored to integers — currently statements 95, branches 87, functions 97,
# lines 95 — and it only ever moves up. Codecov here is for visualization and
# PR feedback, NOT for re-running that gate, so its own status checks are
# configured to be informational: they report movement but never independently
# fail the build.
#
# The targets below are deliberately SLACK relative to the real gate, and they
# are not meant to mirror it. Anything that would breach the Jest ratchet fails
# the `test` job long before a Codecov status is evaluated, so repeating those
# four numbers here would add a second, noisier copy of a value that already has
# one authoritative home. Do not "sync" these to the Jest values: the two serve
# different purposes, and only `jest.config.js` is load-bearing.

coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    project:
      default:
        # A floor for the badge colour and the PR status, set well below the
        # real Jest ratchet on purpose (see the header). It is not the gate.
        target: 80%
        # Allow a 1% downward drift between commits before Codecov flags the
        # status as failing. This absorbs noise from line-counting differences
        # between the local Jest run and Codecov's report parser; the actual
        # enforcement lives in `jest.config.js`.
        threshold: 1%
        # Don't fail PRs while Codecov is still uploading the first run.
        if_ci_failed: success
        # Report against the base commit on PRs; against the previous
        # commit on direct pushes to main.
        if_not_found: success
    patch:
      default:
        # Patches (the changed lines in a PR) should be ~at-or-above the
        # project's floor. Allow a 5% drift so a single under-tested
        # one-liner doesn't block an otherwise-fine PR. Same caveat as above:
        # informational, not the gate.
        target: 80%
        threshold: 5%
        if_ci_failed: success
        if_not_found: success

comment:
  # Concise PR comment: header (with the project + patch deltas), a short
  # file-by-file diff table, and the standard footer. Skip the
  # "components" block (we don't define components) and "tree" (the file
  # table is enough signal without a full repo tree).
  layout: "header, diff, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Files / paths Codecov should not measure. Tests cover themselves trivially;
# the bench harness is not production code; build output and node_modules
# are obvious excludes. Keeping the ignore list here (instead of only in
# jest.config.js' `collectCoverageFrom`) means Codecov's UI also hides them
# from the file tree, not just from percentages.
ignore:
  - "dist/**/*"
  - "node_modules/**/*"
  - "coverage/**/*"
  - "bench/**/*"
  - "src/__tests__/**/*"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.d.ts"
