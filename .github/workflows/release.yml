name: Release

# Tag-driven release pipeline. Pushing an annotated `vX.Y.Z` tag triggers the
# full pipeline: gates → tarball check → npm publish (with provenance) →
# GitHub Release (notes pulled from the matching CHANGELOG.md section).
#
# `workflow_dispatch` provides a manual fallback to re-run a previously
# pushed tag without having to delete + re-push it (e.g. if a prior run
# failed before the publish step succeeded).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.3.2). Required for manual runs."
        required: true
        type: string

# `id-token: write` is required for npm trusted publishing (OIDC): it mints
# both the short-lived publish credential and the provenance attestation.
# `contents: write` is required for `softprops/action-gh-release` to create
# the GitHub Release object. Both are kept at the workflow level (not job
# level) so any future job added to this workflow inherits the minimum it
# needs — there is no other job here that should run with fewer rights.
permissions:
  contents: write
  id-token: write

# Tag refs are immutable, so the practical effect of this group is to
# serialize manual re-runs against the same tag. `cancel-in-progress: false`
# means a second dispatch waits rather than killing an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # On push-tag the ref is already the tag; on manual dispatch we
          # check out the user-supplied tag explicitly so the workflow run
          # operates on the tagged commit, not the latest main.
          ref: ${{ inputs.tag || github.ref }}
          # Full history so the CHANGELOG extraction step has access to the
          # complete file regardless of how shallow the default fetch is.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Pin to current Active LTS. Matches the engines.node floor
          # (>=22.0.0); a publish job has no value running on multiple
          # Node versions since the artifact is identical.
          node-version: 22
          # Must be set explicitly so the npm auth handshake targets the
          # public npm registry rather than any internal/proxy registry
          # the runner may default to.
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Note: the real-browser interop suite (`npm run test:browser`, Vitest +
      # headless Chromium) is deliberately NOT run here. Downloading a browser
      # would slow every publish and add a flaky failure mode to the release
      # path. The Node<->browser wire-format guarantee is instead gated BEFORE
      # the tag exists: the `browser-tests` job in ci.yml runs it on every push
      # and PR to the default branch, and releases are cut from green default-
      # branch commits. The static browser-isolation gate (`check:browser`) and
      # the exports check DO run at publish, via `prepublishOnly`.

      - name: Verify tag matches package.json version
        # Run on both tag pushes AND manual dispatches. The shell guard below
        # validates that `git push origin v1.3.2` only ever publishes the
        # version recorded in package.json — protects against the
        # "forgot to bump package.json before tagging" foot-gun.
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${REF#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION). Refusing to publish."
            exit 1
          fi

      - name: Verify tarball contents
        # `npm pack --dry-run` on its own asserts NOTHING — it exits 0 for any
        # contents and fails only if packing itself errors, so as a gate it
        # checked that npm works rather than that the artifact is right.
        # `check:tarball` turns that same listing into a real gate in both
        # directions: every path the `exports` map resolves to (plus the docs
        # named in `files`) must be present, and sources, tests, benchmarks,
        # source maps, env files, lockfiles, credential material and
        # scratch/backup files must be absent. It deliberately does NOT pin a
        # file count, which would go red on every legitimate new dist/ module.
        #
        # The same command is part of `npm run verify`, so this is a re-check
        # at release time rather than the only place the rule lives.
        run: npm run check:tarball

      # Trusted publishing (OIDC) requires npm >= 11.5.1 to understand the
      # credential-exchange flow; Node 22 ships npm 10, so upgrade first. No
      # NPM_TOKEN is used — short-lived publish credentials are minted
      # automatically from the `id-token: write` grant when the package's
      # trusted-publisher config on npmjs.com matches this repo + workflow.
      #
      # The range is caret-bounded to the current major rather than `latest`,
      # for exactly the reason the `overrides` block in package.json is: an
      # unbounded floor pulls in an untested major, and here that lands on the
      # critical path one step before publish. An npm major that drops this
      # workflow's Node line would break every release with no change on our
      # side, so the bump is made deliberately rather than by npm's release
      # schedule.
      #
      # The check afterwards is not ceremony. If the global install resolves
      # somewhere off PATH the runner's original npm 10 stays active, and that
      # failure would otherwise surface as an opaque OIDC error from
      # `npm publish`, after every gate has already passed.
      #
      # It asserts the 11.5.1 floor itself rather than the pinned major, so it
      # keeps testing the property that actually matters and needs no edit when
      # the pin above is bumped. `sort -V` does the version comparison: if the
      # lower of {11.5.1, installed} is not 11.5.1, the installed npm is older.
      - name: Upgrade npm to an OIDC-capable version
        run: |
          npm install -g "npm@^12"
          installed="$(npm --version)"
          echo "npm $installed"
          if [ "$(printf '%s\n%s\n' "11.5.1" "$installed" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $installed is older than the 11.5.1 that trusted publishing requires - the global npm upgrade did not take effect."
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Extract changelog notes for this release
        id: changelog
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          # CHANGELOG entries are written either as `## [X.Y.Z] - DATE` (the
          # Keep-a-Changelog convention assumed by softprops/action-gh-release
          # tooling) OR as `## DATE (vX.Y.Z — title)` (this project's older
          # style). The awk script accepts both shapes so notes are populated
          # regardless of which heading style a release ships with.
          #
          # BOTH alternatives are anchored to a heading. The legacy one used
          # to match `(vX.Y.Z ` anywhere in any line, so an ordinary prose
          # mention of an old version — the kind a changelog entry about the
          # release tooling naturally contains — started a capture mid-file and
          # truncated that version's notes to nothing. Requiring `^## ` first
          # makes the pattern structural rather than textual.
          #
          # In the legacy shape the version is followed by a space or by the
          # closing paren, which covers both title and bare forms. An earlier
          # revision also listed a `\u2014` alternative: awk has no such
          # escape, so it collapsed to the literal text `u2014` and matched
          # nothing. It was redundant as well as dead, since the plain-space
          # alternative already covers an em-dashed title.
          notes="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" || $0 ~ "^## .*\\(v"ver"( |\\))" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<__EOF__"
            printf "%s\n" "$notes"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false

      - name: Summary
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`$PKG_NAME@$PKG_VERSION\`"
            echo ""
            echo "- npm: <https://www.npmjs.com/package/$PKG_NAME/v/$PKG_VERSION>"
            echo "- Release: <https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}>"
          } >> "$GITHUB_STEP_SUMMARY"
