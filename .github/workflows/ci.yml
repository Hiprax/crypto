name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel previous in-progress runs of this workflow on the same ref so that
# pushes that supersede each other don't pile up the queue. Tag pushes
# (handled by release.yml) are excluded by the branch filter above; this
# group only collapses branch/PR runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The test job only reads the repo and uploads
# nothing back to GitHub; if a future step needs more (e.g. coverage
# upload that writes a PR comment), grant it at the job level.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Cap each leg so a hung native build (argon2 node-gyp on Windows is the
    # historical offender) cannot burn the default 6-hour runner budget.
    timeout-minutes: 20

    strategy:
      # Run every (os, node) combination to completion even if one fails so we
      # see the full failure surface rather than the first failing combo.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # No history needed for CI — tests don't read git log/blame.
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` performs a clean install from the lockfile and runs lifecycle
      # scripts. The `argon2` native dependency is in `optionalDependencies` so
      # if its prebuild + node-gyp fallback fail on a specific runner we still
      # install the rest of the package and the sync (PBKDF2) tests run.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      # Browser-graph isolation gate. Bundles the browser entry with esbuild
      # (platform=browser) and fails if any `node:` builtin is reachable, so
      # node:crypto/fs/stream can never leak into the browser build. Enforced
      # on every push/PR here (not just at release via prepublishOnly). The
      # check uses esbuild's JS API (in-memory, write:false), so it is
      # cross-platform and runs on the Windows leg too.
      - name: Check browser isolation (no Node builtins in browser graph)
        run: npm run check:browser

      # Browser DECLARATION-purity gate. The step above erases types (esbuild)
      # and the ESLint `no-restricted-globals` override does not fire on a
      # TYPE-position `Buffer`, so neither can see a Node type that has leaked
      # into `dist/index.browser.d.ts` or anything it re-exports. This step
      # type-checks a throwaway browser-only consumer (resolved through the
      # `browser` export condition, `"types": []`, `"skipLibCheck": false`)
      # against the built `dist/`, so such a leak fails the build instead of
      # reaching a front-end consumer. Pure Node + TypeScript JS APIs, so it
      # runs on the Windows leg too.
      - name: Check browser declaration purity (no Node types)
        run: npm run check:types:browser

      # Package-exports + published-types gate. publint validates the exports
      # map; attw verifies the shipped .d.ts resolve for ESM and bundler
      # consumers. CJS/node10 resolutions are intentionally ESM-only, so attw
      # runs under `--profile esm-only`. Guards the conditional `.` export and
      # the subpath exports against silent regressions.
      - name: Check package exports and types
        run: npm run check:exports

      # Collect coverage on the Ubuntu / Node 22 leg only — uploading from
      # every (os, node) cell would clutter the Codecov UI and double-count
      # lines that are identical across runners. Other matrix legs still
      # run the suite without `--coverage` to keep their runtime short.
      - name: Test (with coverage)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm test -- --coverage

      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test

      # Skip the upload on PRs from forks: `CODECOV_TOKEN` is not exposed to
      # fork-PR runs, so the action would warn and fail soft anyway. Public
      # repos can technically upload tokenlessly, but the gate keeps the
      # logs clean and avoids a future regression if Codecov tightens that.
      - name: Upload coverage to Codecov
        if: |
          matrix.os == 'ubuntu-latest' &&
          matrix.node == 22 &&
          (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          # `fail_ci_if_error: false` means a transient Codecov outage cannot
          # fail an otherwise-green CI run. The local Jest thresholds in
          # `jest.config.js` (a one-way ratchet, currently statements 95,
          # branches 87, functions 97, lines 95) already enforce the floor;
          # Codecov is the visualization layer, not the gate.
          fail_ci_if_error: false
          slug: Hiprax/crypto

      # Run after build/test/lint/coverage so failures from earlier steps don't
      # get masked by an audit failure (and vice-versa). `--audit-level=high`
      # matches the policy in SECURITY.md: high+critical block the build,
      # moderate+low are tracked but non-blocking.
      - name: Audit dependencies (high+critical only)
        run: npm audit --audit-level=high

  # Real-browser test suite (Vitest Browser Mode, Playwright/Chromium). Proves
  # the crown-jewel guarantee — one wire format that round-trips Node <-> browser
  # — inside an ACTUAL browser engine (SubtleCrypto + hash-wasm WASM Argon2id),
  # decrypting the committed Node-produced golden vectors. Kept as a separate job
  # (not folded into the matrix `test` job) because it needs a downloaded browser
  # and only makes sense on one OS.
  browser-tests:
    name: Browser tests (real Chromium)
    # A single Ubuntu leg is sufficient: the interop guarantee is engine-, not
    # OS-, specific, and the Playwright cache path below is POSIX-specific.
    runs-on: ubuntu-latest
    # Cap the runtime so a hung browser download can't burn the 6-hour budget.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded Playwright browser binaries, keyed on the lockfile so
      # a Playwright version bump invalidates the cache. On a hit the install step
      # below still runs (idempotent + fast) to pull any missing OS system
      # dependencies via `--with-deps`.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium

      # The browser specs import the BUILT browser entry (dist/index.browser.js),
      # so the build must precede the suite.
      - name: Build
        run: npm run build

      - name: Test (real headless Chromium via Vitest Browser Mode)
        run: npm run test:browser
